name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: circus
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: circus/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: circus/pnpm-lock.yaml
      - uses: extractions/setup-just@v4.0.0
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: pnpm install --frozen-lockfile
        working-directory: circus
      - run: just check
        working-directory: circus
