[package]
name = "circus"
version = "0.1.0"
edition = "2024"

[lib]
name = "circus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = "=2.12.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
shlex = "=1.3.0"
libc = "=0.2.190"
